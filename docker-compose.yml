services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chesspulse}
      MYSQL_USER: ${MYSQL_USER:-chesspulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chesspulse}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-chesspulse}?useSSL=false&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:-chesspulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chesspulse}
      STOCKFISH_ENABLED: "true"
      STOCKFISH_PATH: /usr/games/stockfish
    ports: ["8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080/actuator/health | grep UP"]
      interval: 20s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_BASE_URL: http://localhost:8080}
    ports: ["5173:80"]
    depends_on: [backend]
volumes: {mysql-data: {}}
